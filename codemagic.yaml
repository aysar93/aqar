workflows:
  ipad-store-screenshots:
    name: iPad - App Store Screenshots
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Capture real 13-inch iPad screens
        script: python3 tools/capture_ipad_screenshots.py
    artifacts:
      - build/ipad-screenshots.zip
      - build/ipad-screenshots/*.png
      - /tmp/xcodebuild_logs/*.log

  ios-review-no-signing:
    name: iPhone Review - No Apple Account
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Configure Sign in with Apple entitlement
        script: swift tools/configure_ios_entitlements.swift

      - name: Run automated tests
        script: flutter test

      - name: Build iPhone Simulator app without signing
        script: flutter build ios --simulator --debug

      - name: Package simulator build
        script: |
          cd build/ios/iphonesimulator
          zip -r Runner-simulator.zip Runner.app

    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - build/ios/iphonesimulator/Runner-simulator.zip
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

  ios-app-store:
    name: iPhone - App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        # Required secrets and identifiers are documented in
        # docs/ios-codemagic-release.md.
        - appstore_credentials
        - ios_config
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.andalus.aqar
      flutter: stable
      xcode: latest

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Configure Sign in with Apple entitlement
        script: swift tools/configure_ios_entitlements.swift

      - name: Run automated tests
        script: flutter test

      - name: Initialize signing keychain
        script: keychain initialize

      - name: Fetch App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Install signing certificate
        script: keychain add-certificates

      - name: Apply provisioning profiles
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  ios-bookings-testflight:
    name: iPhone - Bookings Staging (TestFlight Prep)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        - media_full_test
      vars:
        FLUTTER_APP_FLAVOR: "bookingsStaging"
        BOOKINGS_IOS_API_KEY: "AIzaSyCq7zSLdE5YMXvwxhbYhNsMCEDNykIox-Q"
        BOOKINGS_IOS_APP_ID: "1:463930605039:ios:9c2430877d2f70b73dca1a"
        BOOKINGS_IOS_BUNDLE_ID: "com.andalus.aqar.staging"
      ios_signing:
        provisioning_profiles:
          - aqar_bookings_staging_app_store
        certificates:
          - rafcut_distribution
      flutter: stable
      xcode: latest

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Configure Sign in with Apple entitlement
        script: swift tools/configure_ios_entitlements.swift

      - name: Inject Firebase Staging configuration
        script: |
          set -e
          echo "Injecting isolated Firebase Staging configuration into Runner..."
          for required_file in \
            ios/BookingsStaging/GoogleService-Info.plist \
            ios/BookingsStaging/Runner.entitlements \
            ios/BookingsStaging/Staging.xcconfig; do
            if [ ! -f "$required_file" ]; then
              echo "ERROR: Required Staging configuration file is missing: $required_file"
              exit 1
            fi
          done
          cp ios/BookingsStaging/GoogleService-Info.plist ios/Runner/GoogleService-Info.plist
          cp ios/BookingsStaging/Runner.entitlements ios/Runner/Runner.entitlements
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.andalus.aqar;/PRODUCT_BUNDLE_IDENTIFIER = com.andalus.aqar.staging;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's|CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;|CODE_SIGN_ENTITLEMENTS = BookingsStaging/Runner.entitlements;|g' ios/Runner.xcodeproj/project.pbxproj
          if ! grep -q "CODE_SIGN_ENTITLEMENTS = BookingsStaging/Runner.entitlements;" ios/Runner.xcodeproj/project.pbxproj; then
            echo "ERROR: Failed to update CODE_SIGN_ENTITLEMENTS to BookingsStaging/Runner.entitlements in project.pbxproj!"
            exit 1
          fi
          echo '#include "../BookingsStaging/Staging.xcconfig"' >> ios/Flutter/Release.xcconfig

      - name: Verify Staging configuration and isolation
        script: |
          set -e
          echo "=== Verifying Staging Configuration Integrity ==="

          # 1. Verify Target Runner Bundle ID in project.pbxproj
          if grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.andalus.aqar;" ios/Runner.xcodeproj/project.pbxproj; then
            echo "ERROR: Production bundle identifier 'com.andalus.aqar' still exists in Runner target settings!"
            exit 1
          fi
          if ! grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.andalus.aqar.staging;" ios/Runner.xcodeproj/project.pbxproj; then
            echo "ERROR: Staging bundle identifier 'com.andalus.aqar.staging' was not applied to project.pbxproj!"
            exit 1
          fi
          if ! grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.andalus.aqar.RunnerTests;" ios/Runner.xcodeproj/project.pbxproj; then
            echo "ERROR: RunnerTests bundle identifier was unexpectedly modified!"
            exit 1
          fi
          echo "✓ Verified Bundle ID: com.andalus.aqar.staging (Production ID eradicated from Runner, RunnerTests untouched)"

          # 2. Verify Firebase configuration
          if grep -q "aqar-9f3f9" ios/Runner/GoogleService-Info.plist; then
            echo "ERROR: Production Firebase project (aqar-9f3f9) detected in ios/Runner/GoogleService-Info.plist!"
            exit 1
          fi
          if ! grep -q "aqar-bookings-test-20261009" ios/Runner/GoogleService-Info.plist; then
            echo "ERROR: Staging Firebase project (aqar-bookings-test-20261009) missing in ios/Runner/GoogleService-Info.plist!"
            exit 1
          fi
          if ! grep -q "com.andalus.aqar.staging" ios/Runner/GoogleService-Info.plist; then
            echo "ERROR: Bundle ID in ios/Runner/GoogleService-Info.plist is not com.andalus.aqar.staging!"
            exit 1
          fi
          echo "✓ Verified Firebase Config: aqar-bookings-test-20261009 (com.andalus.aqar.staging)"

          # 3. Verify Entitlements via PlistBuddy or plutil
          TARGET_ENTITLEMENTS="ios/Runner/Runner.entitlements"
          APS_ENV=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" "$TARGET_ENTITLEMENTS" 2>/dev/null || plutil -extract "aps-environment" raw "$TARGET_ENTITLEMENTS" 2>/dev/null || true)
          if [ "$APS_ENV" != "production" ]; then
            echo "ERROR: Expected aps-environment in $TARGET_ENTITLEMENTS to be 'production', got '$APS_ENV'!"
            exit 1
          fi

          APPLE_SIGNIN=$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.applesignin:0" "$TARGET_ENTITLEMENTS" 2>/dev/null || plutil -extract "com.apple.developer.applesignin.0" raw "$TARGET_ENTITLEMENTS" 2>/dev/null || true)
          if [ "$APPLE_SIGNIN" != "Default" ]; then
            echo "ERROR: Expected com.apple.developer.applesignin to contain 'Default', got '$APPLE_SIGNIN'!"
            exit 1
          fi
          echo "✓ Verified Entitlements via PlistBuddy/plutil: aps-environment=$APS_ENV, applesignin=$APPLE_SIGNIN"
          echo "=== All Staging Pre-Build Checks Passed Successfully ==="

      - name: Install signing certificate
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Verify applied build settings and provisioning profiles
        script: |
          set -e
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT
          PLIST_BUDDY="/usr/libexec/PlistBuddy"

          echo "=== Verifying Target Runner Xcode Release Build Settings Post-Profiles ==="

          # 1. Run xcodebuild -showBuildSettings specifically for target Runner and configuration Release
          RAW_SETTINGS=$(xcodebuild -project ios/Runner.xcodeproj -target Runner -configuration Release -showBuildSettings 2>/dev/null)

          # Extract the specific build settings block for target Runner
          RUNNER_SETTINGS=$(echo "$RAW_SETTINGS" | awk '/Build settings for action build and target ("Runner"|Runner):/{flag=1; next} /^Build settings for/{flag=0} flag')
          if [ -z "$RUNNER_SETTINGS" ]; then
            echo "ERROR: Could not locate explicit build settings block for target Runner in xcodebuild output!"
            echo "Refusing to fall back to unisolated build settings to prevent capturing settings from another target."
            exit 1
          fi

          # 2. Verify PRODUCT_BUNDLE_IDENTIFIER in target Runner Release settings
          ACTUAL_BUNDLE_ID=$(echo "$RUNNER_SETTINGS" | grep -E '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER[[:space:]]*=' | head -n 1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*$//')
          if [ "$ACTUAL_BUNDLE_ID" != "com.andalus.aqar.staging" ]; then
            echo "ERROR: Target Runner Release PRODUCT_BUNDLE_IDENTIFIER is '$ACTUAL_BUNDLE_ID', expected 'com.andalus.aqar.staging'!"
            exit 1
          fi
          echo "✓ Verified xcodebuild Release PRODUCT_BUNDLE_IDENTIFIER = $ACTUAL_BUNDLE_ID"

          # 3. Verify CODE_SIGN_STYLE is Manual
          ACTUAL_SIGN_STYLE=$(echo "$RUNNER_SETTINGS" | grep -E '^[[:space:]]*CODE_SIGN_STYLE[[:space:]]*=' | head -n 1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*$//; s/^"//; s/"$//')
          echo "Target Runner CODE_SIGN_STYLE: '$ACTUAL_SIGN_STYLE'"
          if [ "$ACTUAL_SIGN_STYLE" != "Manual" ]; then
            echo "ERROR: Target Runner Release CODE_SIGN_STYLE is '$ACTUAL_SIGN_STYLE', expected 'Manual'!"
            exit 1
          fi
          echo "✓ Verified xcodebuild Release CODE_SIGN_STYLE = Manual"

          # 4. Verify CODE_SIGN_ENTITLEMENTS strictly points to BookingsStaging/Runner.entitlements and inspect its contents
          ACTUAL_ENTITLEMENTS=$(echo "$RUNNER_SETTINGS" | grep -E '^[[:space:]]*CODE_SIGN_ENTITLEMENTS[[:space:]]*=' | head -n 1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*$//; s/^"//; s/"$//')
          if [ "$ACTUAL_ENTITLEMENTS" != "BookingsStaging/Runner.entitlements" ] || [ ! -f "ios/$ACTUAL_ENTITLEMENTS" ]; then
            echo "ERROR: Target Runner Release CODE_SIGN_ENTITLEMENTS is '$ACTUAL_ENTITLEMENTS', expected 'BookingsStaging/Runner.entitlements'!"
            exit 1
          fi
          ENT_APS=$("$PLIST_BUDDY" -c "Print :aps-environment" "ios/$ACTUAL_ENTITLEMENTS" 2>/dev/null || true)
          ENT_SIGNIN=$("$PLIST_BUDDY" -c "Print :com.apple.developer.applesignin:0" "ios/$ACTUAL_ENTITLEMENTS" 2>/dev/null || true)
          if [ "$ENT_APS" != "production" ] || [ "$ENT_SIGNIN" != "Default" ]; then
            echo "ERROR: ios/$ACTUAL_ENTITLEMENTS has invalid entitlements (aps-environment='$ENT_APS', applesignin='$ENT_SIGNIN')!"
            exit 1
          fi
          echo "✓ Verified xcodebuild Release CODE_SIGN_ENTITLEMENTS = $ACTUAL_ENTITLEMENTS (aps-environment=production, applesignin=Default)"

          # 5. Extract DEVELOPMENT_TEAM (necessary, NOT sufficient proof of provisioning profile binding)
          XCODE_TEAM_ID=$(echo "$RUNNER_SETTINGS" | grep -E '^[[:space:]]*DEVELOPMENT_TEAM[[:space:]]*=' | head -n 1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*$//; s/^"//; s/"$//')
          echo "Target Runner DEVELOPMENT_TEAM: '$XCODE_TEAM_ID'"
          if [ "$XCODE_TEAM_ID" != "H96JUT8PUM" ]; then
            echo "ERROR: Target Runner Release DEVELOPMENT_TEAM is '$XCODE_TEAM_ID', expected 'H96JUT8PUM'!"
            exit 1
          fi
          echo "✓ Verified DEVELOPMENT_TEAM = $XCODE_TEAM_ID (continuing to verify explicit profile & export_options binding)"

          # 6. Inspect both PROVISIONING_PROFILE and PROVISIONING_PROFILE_SPECIFIER
          APPLIED_PROFILE_UUID=$(echo "$RUNNER_SETTINGS" | grep -E '^[[:space:]]*PROVISIONING_PROFILE[[:space:]]*=' | head -n 1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*$//; s/^"//; s/"$//')
          APPLIED_PROFILE_SPECIFIER=$(echo "$RUNNER_SETTINGS" | grep -E '^[[:space:]]*PROVISIONING_PROFILE_SPECIFIER[[:space:]]*=' | head -n 1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*$//; s/^"//; s/"$//')
          echo "Target Runner PROVISIONING_PROFILE:           '$APPLIED_PROFILE_UUID'"
          echo "Target Runner PROVISIONING_PROFILE_SPECIFIER: '$APPLIED_PROFILE_SPECIFIER'"
          if [ -z "$APPLIED_PROFILE_UUID" ] && [ -z "$APPLIED_PROFILE_SPECIFIER" ]; then
            echo "ERROR: Both PROVISIONING_PROFILE and PROVISIONING_PROFILE_SPECIFIER are empty in target Runner Release settings!"
            exit 1
          fi

          # 7. Require $HOME/export_options.plist and read provisioningProfiles for com.andalus.aqar.staging
          EXPORT_OPTIONS_PLIST="$HOME/export_options.plist"
          if [ ! -f "$EXPORT_OPTIONS_PLIST" ]; then
            echo "ERROR: Required $EXPORT_OPTIONS_PLIST is missing!"
            exit 1
          fi
          EXPORT_PROFILE_VALUE=$("$PLIST_BUDDY" -c "Print :provisioningProfiles:com.andalus.aqar.staging" "$EXPORT_OPTIONS_PLIST" 2>/dev/null || true)
          if [ -z "$EXPORT_PROFILE_VALUE" ]; then
            echo "ERROR: $EXPORT_OPTIONS_PLIST does not contain :provisioningProfiles:com.andalus.aqar.staging!"
            exit 1
          fi
          EXPORT_TEAM_ID=$("$PLIST_BUDDY" -c "Print :teamID" "$EXPORT_OPTIONS_PLIST" 2>/dev/null || true)
          if [ -n "$EXPORT_TEAM_ID" ] && [ "$EXPORT_TEAM_ID" != "$XCODE_TEAM_ID" ]; then
            echo "ERROR: $EXPORT_OPTIONS_PLIST teamID '$EXPORT_TEAM_ID' does not match '$XCODE_TEAM_ID'!"
            exit 1
          fi
          echo "export_options.plist provisioningProfiles[com.andalus.aqar.staging] = '$EXPORT_PROFILE_VALUE'"

          # 8. Scan both standard Provisioning Profiles directories and both file extensions, deduplicating by UUID
          SEARCH_DIRS_FOUND=0
          CANDIDATE_COUNT=0
          MATCH_COUNT=0
          MATCHED_PROFILE=""
          MATCHED_PLIST=""
          MATCHED_UUID=""
          MATCHED_NAME=""

          for dir in \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            [ -d "$dir" ] || continue
            SEARCH_DIRS_FOUND=$((SEARCH_DIRS_FOUND + 1))
            for ext in mobileprovision provisionprofile; do
              for p in "$dir"/*."$ext"; do
                [ -e "$p" ] || continue
                CANDIDATE_COUNT=$((CANDIDATE_COUNT + 1))
                TMP_PLIST="$TMP_DIR/candidate_${CANDIDATE_COUNT}.plist"
                if ! security cms -D -i "$p" > "$TMP_PLIST" 2>/dev/null; then
                  continue
                fi
                P_UUID=$("$PLIST_BUDDY" -c "Print :UUID" "$TMP_PLIST" 2>/dev/null || true)
                P_NAME=$("$PLIST_BUDDY" -c "Print :Name" "$TMP_PLIST" 2>/dev/null || true)
                if [ -z "$P_UUID" ]; then
                  continue
                fi

                # Deduplicate identical profiles copied across both standard directories by UUID
                P_SHA256=$(shasum -a 256 "$p" | awk '{print $1}')
                SEEN_MARKER="$TMP_DIR/seen_uuid_${P_UUID}"
                if [ -f "$SEEN_MARKER" ]; then
                  PREV_SHA256=$(cat "$SEEN_MARKER")
                  if [ "$PREV_SHA256" != "$P_SHA256" ]; then
                    echo "ERROR: Conflicting provisioning profile files share the same UUID '$P_UUID'!"
                    exit 1
                  fi
                  continue
                fi
                echo "$P_SHA256" > "$SEEN_MARKER"

                IS_MATCH=1
                if [ -n "$APPLIED_PROFILE_UUID" ] && [ "$P_UUID" != "$APPLIED_PROFILE_UUID" ]; then
                  IS_MATCH=0
                fi
                if [ -n "$APPLIED_PROFILE_SPECIFIER" ] && [ "$P_NAME" != "$APPLIED_PROFILE_SPECIFIER" ] && [ "$P_UUID" != "$APPLIED_PROFILE_SPECIFIER" ]; then
                  IS_MATCH=0
                fi

                if [ "$IS_MATCH" -eq 1 ]; then
                  MATCH_COUNT=$((MATCH_COUNT + 1))
                  MATCHED_PROFILE="$p"
                  MATCHED_PLIST="$TMP_PLIST"
                  MATCHED_UUID="$P_UUID"
                  MATCHED_NAME="$P_NAME"
                fi
              done
            done
          done

          if [ "$SEARCH_DIRS_FOUND" -eq 0 ]; then
            echo "ERROR: Neither standard Provisioning Profiles directory exists under $HOME/Library!"
            exit 1
          fi

          if [ "$MATCH_COUNT" -eq 0 ] || [ -z "$MATCHED_PROFILE" ]; then
            echo "ERROR: No single installed Provisioning Profile (.mobileprovision/.provisionprofile) satisfied all applied references (PROVISIONING_PROFILE='$APPLIED_PROFILE_UUID', PROVISIONING_PROFILE_SPECIFIER='$APPLIED_PROFILE_SPECIFIER')!"
            exit 1
          fi

          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "ERROR: Ambiguous match! $MATCH_COUNT distinct Provisioning Profile UUIDs matched SPECIFIER='$APPLIED_PROFILE_SPECIFIER'!"
            exit 1
          fi

          echo "Matched unique Provisioning Profile:"
          echo "  File: $MATCHED_PROFILE"
          echo "  UUID: $MATCHED_UUID"
          echo "  Name: $MATCHED_NAME"

          # Verify consistency across PROVISIONING_PROFILE, PROVISIONING_PROFILE_SPECIFIER, and export_options.plist
          if [ -n "$APPLIED_PROFILE_UUID" ] && [ "$MATCHED_UUID" != "$APPLIED_PROFILE_UUID" ]; then
            echo "ERROR: Matched profile UUID '$MATCHED_UUID' conflicts with PROVISIONING_PROFILE '$APPLIED_PROFILE_UUID'!"
            exit 1
          fi
          if [ -n "$APPLIED_PROFILE_SPECIFIER" ] && [ "$MATCHED_NAME" != "$APPLIED_PROFILE_SPECIFIER" ] && [ "$MATCHED_UUID" != "$APPLIED_PROFILE_SPECIFIER" ]; then
            echo "ERROR: Matched profile (UUID='$MATCHED_UUID', Name='$MATCHED_NAME') conflicts with PROVISIONING_PROFILE_SPECIFIER '$APPLIED_PROFILE_SPECIFIER'!"
            exit 1
          fi
          if [ "$EXPORT_PROFILE_VALUE" != "$MATCHED_UUID" ] && [ "$EXPORT_PROFILE_VALUE" != "$MATCHED_NAME" ]; then
            echo "ERROR: $EXPORT_OPTIONS_PLIST specifies '$EXPORT_PROFILE_VALUE', which conflicts with matched profile (UUID='$MATCHED_UUID', Name='$MATCHED_NAME')!"
            exit 1
          fi
          echo "✓ Verified PROVISIONING_PROFILE, PROVISIONING_PROFILE_SPECIFIER, and export_options.plist all resolve to the same profile"

          # 9. Verify Team ID and Entitlements in matched profile using PlistBuddy
          PROFILE_TEAM_ID=$("$PLIST_BUDDY" -c "Print :TeamIdentifier:0" "$MATCHED_PLIST" 2>/dev/null || true)
          PROFILE_ENT_TEAM_ID=$("$PLIST_BUDDY" -c "Print :Entitlements:com.apple.developer.team-identifier" "$MATCHED_PLIST" 2>/dev/null || true)
          if [ -z "$PROFILE_TEAM_ID" ]; then
            echo "ERROR: Could not extract :TeamIdentifier:0 from matched Provisioning Profile!"
            exit 1
          fi
          if [ "$XCODE_TEAM_ID" != "$PROFILE_TEAM_ID" ]; then
            echo "ERROR: Team ID mismatch! Xcode DEVELOPMENT_TEAM ($XCODE_TEAM_ID) != Profile TeamIdentifier ($PROFILE_TEAM_ID)!"
            exit 1
          fi
          if [ -n "$PROFILE_ENT_TEAM_ID" ] && [ "$PROFILE_ENT_TEAM_ID" != "$XCODE_TEAM_ID" ]; then
            echo "ERROR: Profile Entitlements team-identifier ($PROFILE_ENT_TEAM_ID) != Xcode DEVELOPMENT_TEAM ($XCODE_TEAM_ID)!"
            exit 1
          fi
          echo "✓ Verified Team ID match: $XCODE_TEAM_ID"

          # 10. Read ApplicationIdentifierPrefix from profile and verify application-identifier strictly equals <Prefix>.com.andalus.aqar.staging
          PROFILE_PREFIX=$("$PLIST_BUDDY" -c "Print :ApplicationIdentifierPrefix:0" "$MATCHED_PLIST" 2>/dev/null || true)
          if [ -z "$PROFILE_PREFIX" ]; then
            echo "ERROR: Could not extract :ApplicationIdentifierPrefix:0 from matched Provisioning Profile!"
            exit 1
          fi
          PROFILE_APP_ID=$("$PLIST_BUDDY" -c "Print :Entitlements:application-identifier" "$MATCHED_PLIST" 2>/dev/null || true)
          EXPECTED_APP_ID="${PROFILE_PREFIX}.com.andalus.aqar.staging"
          echo "Profile ApplicationIdentifierPrefix: '$PROFILE_PREFIX'"
          echo "Applied profile application-identifier: '$PROFILE_APP_ID'"
          echo "Expected application-identifier:        '$EXPECTED_APP_ID'"
          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "ERROR: Profile application-identifier '$PROFILE_APP_ID' does NOT match expected '$EXPECTED_APP_ID'!"
            exit 1
          fi
          echo "✓ Verified application-identifier exactly equals $EXPECTED_APP_ID"

          # 11. Verify aps-environment and Sign in with Apple in Profile Entitlements
          APS_IN_PROFILE=$("$PLIST_BUDDY" -c "Print :Entitlements:aps-environment" "$MATCHED_PLIST" 2>/dev/null || true)
          if [ "$APS_IN_PROFILE" != "production" ]; then
            echo "ERROR: Applied Provisioning Profile aps-environment is '$APS_IN_PROFILE', expected 'production'!"
            exit 1
          fi
          echo "✓ Verified Profile aps-environment = production"

          SIGNIN_IN_PROFILE=$("$PLIST_BUDDY" -c "Print :Entitlements:com.apple.developer.applesignin:0" "$MATCHED_PLIST" 2>/dev/null || true)
          if [ "$SIGNIN_IN_PROFILE" != "Default" ]; then
            echo "ERROR: Applied Provisioning Profile Sign in with Apple capability is '$SIGNIN_IN_PROFILE', expected 'Default'!"
            exit 1
          fi
          echo "✓ Verified Profile Sign in with Apple = Default"

          echo "=== Post-Profile Build Settings Verification Completed Successfully ==="

      - name: Build Staging TestFlight IPA (Artifact Only)
        script: |
          set -e
          BUILD_NUMBER=1
          echo "Using local fixed staging build number: $BUILD_NUMBER"

          flutter build ipa --release \
            --target=lib/bookings_ios_staging_main.dart \
            --dart-define=FLUTTER_APP_FLAVOR="$FLUTTER_APP_FLAVOR" \
            --dart-define=BOOKINGS_IOS_API_KEY="$BOOKINGS_IOS_API_KEY" \
            --dart-define=BOOKINGS_IOS_APP_ID="$BOOKINGS_IOS_APP_ID" \
            --dart-define=BOOKINGS_IOS_BUNDLE_ID="$BOOKINGS_IOS_BUNDLE_ID" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"

      - name: Verify built Staging IPA signature and isolation
        script: |
          set -e
          PLIST_BUDDY="/usr/libexec/PlistBuddy"
          IPA_TMP=$(mktemp -d)
          trap 'rm -rf "$IPA_TMP"' EXIT

          echo "=== Verifying Built Staging IPA Archive ==="

          IPA_COUNT=0
          IPA_PATH=""
          for f in build/ios/ipa/*.ipa; do
            [ -e "$f" ] || continue
            IPA_COUNT=$((IPA_COUNT + 1))
            IPA_PATH="$f"
          done
          if [ "$IPA_COUNT" -ne 1 ] || [ -z "$IPA_PATH" ]; then
            echo "ERROR: Expected exactly 1 .ipa in build/ios/ipa/, found $IPA_COUNT!"
            exit 1
          fi
          echo "Inspecting IPA: $IPA_PATH"

          unzip -q "$IPA_PATH" -d "$IPA_TMP"
          APP_COUNT=0
          APP_DIR=""
          for a in "$IPA_TMP"/Payload/*.app; do
            [ -d "$a" ] || continue
            APP_COUNT=$((APP_COUNT + 1))
            APP_DIR="$a"
          done
          if [ "$APP_COUNT" -ne 1 ] || [ -z "$APP_DIR" ]; then
            echo "ERROR: Expected exactly 1 .app bundle in IPA Payload/, found $APP_COUNT!"
            exit 1
          fi
          echo "Inspecting App Bundle: $(basename "$APP_DIR")"

          # 1. Verify Bundle ID in IPA Info.plist
          IPA_BUNDLE_ID=$("$PLIST_BUDDY" -c "Print :CFBundleIdentifier" "$APP_DIR/Info.plist" 2>/dev/null || true)
          if [ "$IPA_BUNDLE_ID" != "com.andalus.aqar.staging" ]; then
            echo "ERROR: IPA CFBundleIdentifier is '$IPA_BUNDLE_ID', expected 'com.andalus.aqar.staging'!"
            exit 1
          fi
          echo "✓ Verified IPA Info.plist CFBundleIdentifier = $IPA_BUNDLE_ID"

          # 2. Verify Firebase Staging GoogleService-Info.plist inside IPA
          if [ ! -f "$APP_DIR/GoogleService-Info.plist" ]; then
            echo "ERROR: GoogleService-Info.plist is missing from built IPA bundle!"
            exit 1
          fi
          IPA_FB_PROJECT=$("$PLIST_BUDDY" -c "Print :PROJECT_ID" "$APP_DIR/GoogleService-Info.plist" 2>/dev/null || true)
          IPA_FB_BUNDLE=$("$PLIST_BUDDY" -c "Print :BUNDLE_ID" "$APP_DIR/GoogleService-Info.plist" 2>/dev/null || true)
          IPA_FB_APP_ID=$("$PLIST_BUDDY" -c "Print :GOOGLE_APP_ID" "$APP_DIR/GoogleService-Info.plist" 2>/dev/null || true)
          if [ "$IPA_FB_PROJECT" != "aqar-bookings-test-20261009" ] || \
             [ "$IPA_FB_BUNDLE" != "com.andalus.aqar.staging" ] || \
             [ "$IPA_FB_APP_ID" != "1:463930605039:ios:9c2430877d2f70b73dca1a" ]; then
            echo "ERROR: IPA contains invalid GoogleService-Info.plist (PROJECT_ID='$IPA_FB_PROJECT', BUNDLE_ID='$IPA_FB_BUNDLE', GOOGLE_APP_ID='$IPA_FB_APP_ID')!"
            exit 1
          fi
          echo "✓ Verified IPA GoogleService-Info.plist matches aqar-bookings-test-20261009 / com.andalus.aqar.staging"

          # 3. Verify embedded.mobileprovision inside IPA
          EMB_PROFILE="$APP_DIR/embedded.mobileprovision"
          if [ ! -f "$EMB_PROFILE" ]; then
            echo "ERROR: embedded.mobileprovision is missing from built IPA bundle!"
            exit 1
          fi
          security cms -D -i "$EMB_PROFILE" > "$IPA_TMP/embedded_profile.plist"
          EMB_UUID=$("$PLIST_BUDDY" -c "Print :UUID" "$IPA_TMP/embedded_profile.plist" 2>/dev/null || true)
          EMB_NAME=$("$PLIST_BUDDY" -c "Print :Name" "$IPA_TMP/embedded_profile.plist" 2>/dev/null || true)
          EMB_TEAM=$("$PLIST_BUDDY" -c "Print :TeamIdentifier:0" "$IPA_TMP/embedded_profile.plist" 2>/dev/null || true)
          EMB_PREFIX=$("$PLIST_BUDDY" -c "Print :ApplicationIdentifierPrefix:0" "$IPA_TMP/embedded_profile.plist" 2>/dev/null || true)
          EMB_APP_ID=$("$PLIST_BUDDY" -c "Print :Entitlements:application-identifier" "$IPA_TMP/embedded_profile.plist" 2>/dev/null || true)
          EMB_APS=$("$PLIST_BUDDY" -c "Print :Entitlements:aps-environment" "$IPA_TMP/embedded_profile.plist" 2>/dev/null || true)
          EMB_SIGNIN=$("$PLIST_BUDDY" -c "Print :Entitlements:com.apple.developer.applesignin:0" "$IPA_TMP/embedded_profile.plist" 2>/dev/null || true)

          echo "IPA Embedded Profile UUID: $EMB_UUID"
          echo "IPA Embedded Profile Name: $EMB_NAME"
          if [ "$EMB_TEAM" != "H96JUT8PUM" ] || [ -z "$EMB_PREFIX" ] || [ "$EMB_APP_ID" != "${EMB_PREFIX}.com.andalus.aqar.staging" ]; then
            echo "ERROR: IPA embedded profile ID/Team mismatch (Team='$EMB_TEAM', Prefix='$EMB_PREFIX', AppID='$EMB_APP_ID')!"
            exit 1
          fi
          if [ "$EMB_APS" != "production" ] || [ "$EMB_SIGNIN" != "Default" ]; then
            echo "ERROR: IPA embedded profile entitlements mismatch (aps-environment='$EMB_APS', applesignin='$EMB_SIGNIN')!"
            exit 1
          fi
          EXPORT_PROFILE_VALUE=$("$PLIST_BUDDY" -c "Print :provisioningProfiles:com.andalus.aqar.staging" "$HOME/export_options.plist" 2>/dev/null || true)
          if [ "$EXPORT_PROFILE_VALUE" != "$EMB_UUID" ] && [ "$EXPORT_PROFILE_VALUE" != "$EMB_NAME" ]; then
            echo "ERROR: IPA embedded profile (UUID='$EMB_UUID', Name='$EMB_NAME') does not match export_options.plist ('$EXPORT_PROFILE_VALUE')!"
            exit 1
          fi
          echo "✓ Verified IPA embedded.mobileprovision ($EMB_APP_ID, Team=$EMB_TEAM, aps=production, SignIn=Default)"

          # 4. Verify codesign integrity, Team ID, Bundle Identifier, and signed binary entitlements
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          codesign -dvv "$APP_DIR" > "$IPA_TMP/codesign_info.txt" 2>&1
          cat "$IPA_TMP/codesign_info.txt"

          if ! grep -q "^TeamIdentifier=H96JUT8PUM$" "$IPA_TMP/codesign_info.txt"; then
            echo "ERROR: codesign TeamIdentifier is not H96JUT8PUM!"
            exit 1
          fi
          if ! grep -q "^Identifier=com.andalus.aqar.staging$" "$IPA_TMP/codesign_info.txt"; then
            echo "ERROR: codesign Identifier is not com.andalus.aqar.staging!"
            exit 1
          fi
          if ! grep -q "^Authority=" "$IPA_TMP/codesign_info.txt"; then
            echo "ERROR: IPA signature has no signing Authority (possible ad-hoc or unsigned build)!"
            exit 1
          fi

          codesign -d --entitlements :- "$APP_DIR" > "$IPA_TMP/app_entitlements.plist" 2>/dev/null
          SIGNED_APP_ID=$("$PLIST_BUDDY" -c "Print :application-identifier" "$IPA_TMP/app_entitlements.plist" 2>/dev/null || true)
          SIGNED_TEAM_ID=$("$PLIST_BUDDY" -c "Print :com.apple.developer.team-identifier" "$IPA_TMP/app_entitlements.plist" 2>/dev/null || true)
          SIGNED_APS=$("$PLIST_BUDDY" -c "Print :aps-environment" "$IPA_TMP/app_entitlements.plist" 2>/dev/null || true)
          SIGNED_SIGNIN=$("$PLIST_BUDDY" -c "Print :com.apple.developer.applesignin:0" "$IPA_TMP/app_entitlements.plist" 2>/dev/null || true)
          if [ "$SIGNED_APP_ID" != "${EMB_PREFIX}.com.andalus.aqar.staging" ] || \
             [ "$SIGNED_TEAM_ID" != "H96JUT8PUM" ] || \
             [ "$SIGNED_APS" != "production" ] || \
             [ "$SIGNED_SIGNIN" != "Default" ]; then
            echo "ERROR: Signed binary entitlements mismatch (app-id='$SIGNED_APP_ID', team='$SIGNED_TEAM_ID', aps='$SIGNED_APS', signin='$SIGNED_SIGNIN')!"
            exit 1
          fi
          echo "✓ Verified codesign binary entitlements match embedded profile and Staging requirements"

          # 5. Verify the IPA leaf signing certificate is included in embedded.mobileprovision DeveloperCertificates
          codesign -d --extract-certificates="$IPA_TMP/cert" "$APP_DIR" 2>/dev/null
          if [ ! -f "$IPA_TMP/cert0" ]; then
            echo "ERROR: Could not extract leaf signing certificate from $APP_DIR!"
            exit 1
          fi
          python3 - "$IPA_TMP/cert0" "$IPA_TMP/embedded_profile.plist" << 'PYEOF'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              leaf = f.read()
          with open(sys.argv[2], 'rb') as f:
              prof = plistlib.load(f)
          certs = prof.get('DeveloperCertificates', [])
          if leaf not in certs:
              print('ERROR: IPA leaf signing certificate is NOT in embedded.mobileprovision DeveloperCertificates!')
              sys.exit(1)
          print('✓ Verified IPA leaf signing certificate is authorized by embedded.mobileprovision')
          PYEOF

          echo "=== Staging IPA Verification Completed Successfully ==="

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

