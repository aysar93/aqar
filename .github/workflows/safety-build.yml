name: Safety and iOS build
on:
  push:
    branches: [main, 'codex/**', 'feature/bookings']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/payment_accounts_test.dart test/booking_navigation_test.dart test/booking_phase_two_test.dart test/navigation_return_test.dart
      - run: flutter test test/safe_snapshots_lifecycle_test.dart test/home_auth_layout_test.dart test/content_policy_test.dart test/user_blocks_test.dart test/content_report_test.dart test/reel_model_test.dart test/iraqi_phone_service_test.dart test/services
      - run: flutter build ios --release --no-codesign
  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix test/firestore
      - run: npx -y firebase-tools@15.31.0 emulators:exec --only firestore --project demo-aqar --config firebase.reports-test.json "node --test test/firestore/featured_properties.test.cjs && python test/firestore_safety_rules_test.py"
      - run: npm ci --prefix functions
      - run: node --test functions/booking_policy.test.js
      - run: npx -y firebase-tools@15.31.0 emulators:exec --only firestore,storage --project demo-aqar --config firebase.bookings-test.json "node test/run_booking_tests.cjs"
