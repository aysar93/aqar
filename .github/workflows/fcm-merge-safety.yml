name: FCM merge safety (local emulator only, no builds or deployment)
on:
  pull_request:
    branches: [main]
    paths: ['functions/**', 'tools/*fcm*', 'tools/trusted_inbox_history_plan.cjs', 'test/firestore/trusted_inbox_next.test.cjs', 'test/trusted_inbox_history_plan.test.cjs', 'test/fcm_merge_safety.test.cjs', 'firebase*.json', 'firestore.rules', '.github/workflows/**', 'codemagic.yaml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: fcm-merge-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-aqar
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8186
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --prefix functions
      - run: npm ci --ignore-scripts --prefix test/firestore
      - run: node --test test/fcm_merge_safety.test.cjs test/trusted_inbox_history_plan.test.cjs
      - run: npx -y firebase-tools@15.31.0 emulators:exec --only firestore --project demo-aqar --config firebase.trusted-inbox-test.json "node --test test/firestore/trusted_inbox_next.test.cjs"
